image: golang:latest
stages:
  - build
  - test

before_script:
  - mkdir -p /go/src/codeberg.org/FreifunkBremen/
  - cp -R /builds/freifunkbremen/yanic /go/src/codeberg.org/FreifunkBremen/yanic
  - cd /go/src/codeberg.org/FreifunkBremen/yanic
  - go get -t ./...

build-my-project:
  stage: build
  script:
    - go install -ldflags "-X codeberg.org/FreifunkBremen/yanic/cmd.VERSION=`git -C $GOPATH/src/codeberg.org/FreifunkBremen/yanic rev-parse HEAD`" codeberg.org/FreifunkBremen/yanic
    - mkdir /builds/freifunkbremen/yanic/bin/
    - cp /go/bin/yanic /builds/freifunkbremen/yanic/bin/yanic
  artifacts:
    paths:
      - bin/yanic
      - config_example.toml
      - config-respondd_example.toml

test-my-project:
  stage: test
  script:
    - ./.circleci/check-gofmt
    - ./.circleci/check-testfiles
    - go test $(go list ./... | grep -v /vendor/) -v -coverprofile .testCoverage.txt
    - go tool cover -func=.testCoverage.txt

test-race-my-project:
  stage: test
  script:
    - go test -race ./...
